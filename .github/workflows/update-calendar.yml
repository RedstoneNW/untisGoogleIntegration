name: Update Calendar

on:
  # Allow manual triggers
  workflow_dispatch:

  # Schedule the workflow to run daily at 08:15
  schedule:
    - cron: '15 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 20
      - name: Set up JDK 20
        uses: actions/setup-java@v3
        with:
          java-version: '20'
          distribution: 'oracle'
          cache: 'gradle'

      # Step 3: Build the project
      - name: Build Project
        run: ./gradlew build

      # Step 3: Run your Java project
      - name: Run Main class
        run: java -cp "build/classes/java/main" dataHandlement.Main
