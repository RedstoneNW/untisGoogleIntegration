plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url='https://jitpack.io' }
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-Xlint:deprecation'
}

dependencies {
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'com.google.guava:guava:33.0.0-jre'
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.15.0'
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20220715-2.0.0'
    implementation 'com.github.untisapi:untis4j:v1.3.4'
    implementation 'com.miglayout:miglayout-swing:5.3'
    implementation 'org.jdesktop:beansbinding:1.2.1'
    implementation 'com.github.peter-gergely-horvath:windpapi4j:1.1.0'
    implementation 'com.formdev:flatlaf:3.2.5'
    implementation 'org.tomlj:tomlj:1.1.0'
    implementation 'org.json:json:20231013'
}

shadowJar {
    mergeServiceFiles()
    archiveBaseName = 'Untis-Google-CalendarIntegration'
    archiveClassifier = 'fat'  // optional: this prevents it from appending '-all'
    archiveVersion = '1.0.0'  // optional: this removes the version suffix
}


test {
    useJUnitPlatform()
}